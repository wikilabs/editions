<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 640" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#444"/>
    </marker>
    <style>
      .title    { font-size: 22px; font-weight: 700; fill: #1a1a1a; }
      .subtitle { font-size: 13px; fill: #555; }
      .h        { font-size: 14px; font-weight: 700; fill: #1a1a1a; }
      .sub      { font-size: 12px; fill: #555; }
      .mono     { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; fill: #111; }
      .small    { font-size: 11px; fill: #444; }
      .step-num   { font-size: 16px; font-weight: 700; fill: #fff; }
      .step-title { font-size: 13px; font-weight: 700; fill: #1a1a1a; }
      .step-tag   { font-size: 11.5px; fill: #444; }
      .state-key  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; fill: #1a1a1a; font-weight: 700; }
      .state-val  { font-size: 11px; fill: #555; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    </style>
  </defs>

  <text x="590" y="32" text-anchor="middle" class="title">Custom Markup v1.0 — Parse Pipeline</text>
  <text x="590" y="54" text-anchor="middle" class="subtitle">Five steps, one per parse. For step-by-step detail see the tiddler text.</text>

  <rect x="40" y="80" width="280" height="120" rx="10" fill="#fff8e1" stroke="#c79100" stroke-width="1.4"/>
  <text x="56" y="104" class="h">Input — a single tiddler</text>
  <text x="56" y="126" class="mono">type: text/vnd.tiddlywiki</text>
  <text x="56" y="142" class="mono">       ;vocab=Default,Markdown</text>
  <text x="56" y="166" class="mono">\importcustom [tag[vocab/X]]</text>
  <text x="56" y="188" class="mono"># body  ** bold **  /° foo °/</text>

  <line x1="320" y1="140" x2="346" y2="140" stroke="#444" stroke-width="2" marker-end="url(#arr3)"/>

  <rect x="350" y="80" width="800" height="520" rx="12" fill="#f6f8fa" stroke="#57606a" stroke-width="1.4"/>
  <text x="370" y="104" class="h">TiddlyWiki WikiParser  (one per parse)</text>
  <text x="370" y="122" class="sub">instantiateRules → parsePragmas (wrapped) → parseBlocks → render</text>

  <rect x="370" y="140" width="760" height="58" rx="10" fill="#e6f4ff" stroke="#0969da" stroke-width="1.2"/>
  <circle cx="394" cy="170" r="14" fill="#0969da"/>
  <text x="394" y="176" text-anchor="middle" class="step-num">1</text>
  <text x="418" y="166" class="step-title">cmblock.init() — bootstrap the registry</text>
  <text x="418" y="187" class="step-tag">build cmRegistry · load all markers + global pragmas · activate from type field · schedule core-rule amendment</text>

  <rect x="370" y="206" width="760" height="58" rx="10" fill="#e6f4ff" stroke="#0969da" stroke-width="1.2"/>
  <circle cx="394" cy="236" r="14" fill="#0969da"/>
  <text x="394" y="242" text-anchor="middle" class="step-num">2</text>
  <text x="418" y="232" class="step-title">Build the master regex</text>
  <text x="418" y="253" class="step-tag">covers EVERY known marker — survives TW's rule-pruning so pragma-activated vocabs still fire</text>

  <rect x="370" y="272" width="760" height="80" rx="10" fill="#f0eaff" stroke="#8250df" stroke-width="1.2"/>
  <circle cx="394" cy="302" r="14" fill="#8250df"/>
  <text x="394" y="308" text-anchor="middle" class="step-num">3</text>
  <text x="418" y="298" class="step-title">parsePragmas (wrapped) — amend rules + run user pragmas</text>
  <text x="418" y="319" class="step-tag">amendRules removes vocab-declared core rules  ·  \custom / \importcustom / \debugmarker fire</text>
  <text x="418" y="338" class="step-tag">then  _cmPragmasDone = true  ·  refresh matchIndex cache for affected rules</text>

  <rect x="370" y="360" width="760" height="76" rx="10" fill="#e8f7e8" stroke="#1f883d" stroke-width="1.2"/>
  <circle cx="394" cy="390" r="14" fill="#1f883d"/>
  <text x="394" y="396" text-anchor="middle" class="step-num">4</text>
  <text x="418" y="386" class="step-title">parseBlocks / parseInlineRun — match, filter, render</text>
  <text x="418" y="407" class="step-tag">active-set filter skips inactive matches  ·  parse body per `kind`</text>
  <text x="418" y="424" class="step-tag">emit element with `wltc` + `wltc-l&lt;N&gt;` + marker classes  ·  scrub attrs (see Custom Markup Security)</text>

  <rect x="370" y="444" width="760" height="58" rx="10" fill="#fff4d6" stroke="#bf8700" stroke-width="1.2"/>
  <circle cx="394" cy="474" r="14" fill="#bf8700"/>
  <text x="394" y="480" text-anchor="middle" class="step-num">5</text>
  <text x="418" y="470" class="step-title">Parse tree → widget tree → DOM</text>
  <text x="418" y="491" class="step-tag">TW takes over.  Markers with `debug` emit a codeblock alongside the normal render.</text>

  <text x="1110" y="160" text-anchor="end" class="small" font-style="italic" fill="#666">init</text>
  <text x="1110" y="226" text-anchor="end" class="small" font-style="italic" fill="#666">regex</text>
  <text x="1110" y="296" text-anchor="end" class="small" font-style="italic" fill="#666">pragmas</text>
  <text x="1110" y="384" text-anchor="end" class="small" font-style="italic" fill="#666">parse</text>
  <text x="1110" y="464" text-anchor="end" class="small" font-style="italic" fill="#666">render</text>

  <text x="750" y="535" text-anchor="middle" class="sub">↓ DOM in the browser</text>

  <rect x="40" y="220" width="280" height="380" rx="10" fill="#f0eaff" stroke="#8250df" stroke-width="1.4"/>
  <text x="56" y="244" class="h">cmRegistry state</text>
  <text x="56" y="262" class="sub">(one per parser instance)</text>

  <line x1="56" y1="276" x2="304" y2="276" stroke="#8250df" stroke-width="0.6" stroke-dasharray="3,2"/>
  <text x="56" y="296" class="state-key">markers</text>
  <text x="56" y="312" class="state-val">open → config (every known marker)</text>

  <text x="56" y="338" class="state-key">active</text>
  <text x="56" y="354" class="state-val">Set&lt;open&gt; — gates emission AND</text>
  <text x="56" y="368" class="state-val">findNextMatch (after step 3)</text>

  <text x="56" y="392" class="state-key">activeVocabs</text>
  <text x="56" y="408" class="state-val">Set&lt;title&gt; — other rules gate on this</text>

  <text x="56" y="432" class="state-key">disabledCoreRules</text>
  <text x="56" y="448" class="state-val">Set — union of vocabs'</text>
  <text x="56" y="462" class="state-val">disable-core-rules</text>

  <text x="56" y="486" class="state-key">frontMatter</text>
  <text x="56" y="502" class="state-val">bool — YAML at pos 0</text>

  <text x="56" y="526" class="state-key">blockRegex · inlineRegex</text>
  <text x="56" y="542" class="state-val">longest-open first</text>

  <text x="56" y="566" class="state-key">parser._cmPragmasDone</text>
  <text x="56" y="582" class="state-val">flips at end of step 3</text>

</svg>