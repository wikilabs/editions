<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 730" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#333"/>
    </marker>
    <marker id="diamond-filled" viewBox="0 0 14 10" refX="13" refY="5" markerWidth="14" markerHeight="10" orient="auto">
      <path d="M0 5 L7 0 L14 5 L7 10 z" fill="#333"/>
    </marker>
    <style>
      .title    { font-size: 22px; font-weight: 700; fill: #1a1a1a; }
      .subtitle { font-size: 13px; fill: #555; }
      .stereo   { font-size: 11px; font-style: italic; fill: #555; }
      .name     { font-size: 17px; font-weight: 700; fill: #1a1a1a; }
      .sect     { font-size: 10px; font-weight: 700; fill: #2c3e50; text-transform: uppercase; letter-spacing: 0.06em; }
      .id       { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; fill: #111; }
      .id-key   { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; fill: #b30000; font-weight: 700; }
      .rel      { font-size: 13px; font-style: italic; fill: #1a1a1a; font-weight: 600; }
      .rel-note { font-size: 11px; fill: #555; font-style: italic; }
      .mult     { font-size: 12px; font-weight: 700; fill: #444; }
      .enum-name { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; fill: #1a1a1a; font-weight: 700; }
      .enum-desc { font-size: 11px; fill: #555; }
      .ent-source { stroke: #c79100; stroke-width: 1.6; fill: #fffdf3; }
      .ent-vocab  { stroke: #0969da; stroke-width: 1.6; fill: #f4faff; }
      .ent-marker { stroke: #1f883d; stroke-width: 1.6; fill: #f3fbf5; }
      .ent-enum   { stroke: #8250df; stroke-width: 1.6; fill: #f7f3ff; }
      .div-s { stroke: #c79100; stroke-width: 0.8; }
      .div-v { stroke: #0969da; stroke-width: 0.8; }
      .div-m { stroke: #1f883d; stroke-width: 0.8; }
      .div-k { stroke: #8250df; stroke-width: 0.8; }
      .div-thin { stroke-width: 0.4; stroke-dasharray: 2,3; }
    </style>
  </defs>

  <text x="570" y="36" text-anchor="middle" class="title">Custom Markup v1.0 — Data Shape</text>
  <text x="570" y="58" text-anchor="middle" class="subtitle">Four entities, three relationships. Every entity is a tiddler.</text>

  <rect x="380" y="80" width="380" height="120" rx="8" class="ent-source"/>
  <text x="570" y="102" text-anchor="middle" class="stereo">«source tiddler»</text>
  <text x="570" y="124" text-anchor="middle" class="name">Source Tiddler</text>
  <line x1="400" y1="136" x2="740" y2="136" class="div-s"/>
  <text x="400" y="158" class="id-key">type : text/vnd.tiddlywiki[;vocab=A,B]</text>
  <text x="400" y="176" class="id">text : may contain  \importcustom &lt;filter&gt;</text>
  <text x="400" y="192" class="id">                     \custom &lt;kind&gt;=&lt;sym&gt; ...</text>

  <line x1="570" y1="202" x2="570" y2="258" stroke="#333" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="580" y="222" class="rel">activates</text>
  <text x="580" y="238" class="rel-note">via `;vocab=` or `\importcustom`</text>
  <text x="560" y="218" text-anchor="end" class="mult">1</text>
  <text x="560" y="248" text-anchor="end" class="mult">0..*</text>

  <rect x="380" y="260" width="380" height="120" rx="8" class="ent-vocab"/>
  <text x="570" y="282" text-anchor="middle" class="stereo">«vocabulary tiddler»</text>
  <text x="570" y="304" text-anchor="middle" class="name">Vocabulary</text>
  <line x1="400" y1="316" x2="740" y2="316" class="div-v"/>
  <text x="400" y="338" class="id-key">title = "vocab/&lt;lowercase-caption&gt;"</text>
  <text x="400" y="356" class="id">caption · description</text>
  <text x="400" y="372" class="id">disable-core-rules? · front-matter?</text>

  <line x1="570" y1="382" x2="570" y2="438" stroke="#333" stroke-width="1.8" marker-end="url(#diamond-filled)"/>
  <text x="580" y="402" class="rel">groups</text>
  <text x="580" y="418" class="rel-note">marker.tags ∈ vocabulary.title</text>
  <text x="560" y="398" text-anchor="end" class="mult">1</text>
  <text x="560" y="428" text-anchor="end" class="mult">1..*</text>

  <rect x="190" y="440" width="570" height="260" rx="8" class="ent-marker"/>
  <text x="475" y="462" text-anchor="middle" class="stereo">«marker tiddler»</text>
  <text x="475" y="484" text-anchor="middle" class="name">Marker</text>
  <line x1="210" y1="496" x2="740" y2="496" class="div-m"/>

  <text x="210" y="518" class="sect">identity</text>
  <text x="290" y="518" class="id">title · tags · caption · description</text>
  <line x1="210" y1="528" x2="740" y2="528" class="div-m div-thin"/>

  <text x="210" y="548" class="sect">matching</text>
  <text x="290" y="548" class="id-key">kind</text>
  <text x="328" y="548" class="id">·</text>
  <text x="338" y="548" class="id-key">open</text>
  <text x="372" y="548" class="id"> · close · open-pattern · max-level · allow-symbol</text>
  <line x1="210" y1="558" x2="740" y2="558" class="div-m div-thin"/>

  <text x="210" y="578" class="sect">output</text>
  <text x="290" y="578" class="id">element · classes · attributes · container · item-element</text>
  <line x1="210" y1="588" x2="740" y2="588" class="div-m div-thin"/>

  <text x="210" y="608" class="sect">body parsing</text>
  <text x="312" y="608" class="id">mode · paragraph-marker · end-string · emit-open · body-raw</text>
  <line x1="210" y1="618" x2="740" y2="618" class="div-m div-thin"/>

  <text x="210" y="638" class="sect">editor &amp; back-compat</text>
  <text x="370" y="638" class="id">marker-icon · order · legacy-kind · allow-classes · debug</text>
  <line x1="210" y1="648" x2="740" y2="648" class="div-m div-thin"/>

  <text x="210" y="668" class="sect">security</text>
  <text x="290" y="668" class="id-key">allow-unsafe</text>
  <text x="375" y="668" class="id">(default no — see Custom Markup Security)</text>

  <text x="475" y="692" text-anchor="middle" class="subtitle">most markers only need fields from the first two clusters</text>

  <line x1="760" y1="548" x2="818" y2="548" stroke="#333" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="770" y="540" class="rel">is</text>
  <text x="813" y="562" text-anchor="end" class="mult">1</text>

  <rect x="820" y="410" width="300" height="280" rx="8" class="ent-enum"/>
  <text x="970" y="432" text-anchor="middle" class="stereo">«enumeration»</text>
  <text x="970" y="454" text-anchor="middle" class="name">MarkerKind</text>
  <line x1="840" y1="466" x2="1100" y2="466" class="div-k"/>

  <text x="840" y="490" class="enum-name">glyph</text>
  <text x="840" y="506" class="enum-desc">single-fire block; whole line is body</text>

  <text x="840" y="528" class="enum-name">glyph-level</text>
  <text x="840" y="544" class="enum-desc">N repeats → emits class `wltc-lN`</text>

  <text x="840" y="566" class="enum-name">word</text>
  <text x="840" y="582" class="enum-desc">keyword block (one line or multi-block)</text>

  <text x="840" y="604" class="enum-name">inline-pair</text>
  <text x="840" y="620" class="enum-desc">`open` … `close` anywhere on a line</text>

  <text x="840" y="642" class="enum-name">list-item</text>
  <text x="840" y="658" class="enum-desc">consecutive items collapse into a</text>
  <text x="840" y="672" class="enum-desc">single container (ul/ol/dl/blockquote)</text>

  <text x="60" y="708" class="subtitle"><tspan font-weight="700" fill="#1a1a1a">◆</tspan> at the owner end = composition  ·  <tspan class="id-key" font-size="11">red</tspan> = required identity / PK  ·  `?` suffix = optional field</text>
</svg>