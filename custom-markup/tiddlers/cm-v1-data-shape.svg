<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1020" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#333"/>
    </marker>
    <marker id="diamond-open" viewBox="0 0 14 10" refX="13" refY="5" markerWidth="14" markerHeight="10" orient="auto">
      <path d="M0 5 L7 0 L14 5 L7 10 z" fill="#fff" stroke="#333" stroke-width="1.2"/>
    </marker>
    <marker id="diamond-filled" viewBox="0 0 14 10" refX="13" refY="5" markerWidth="14" markerHeight="10" orient="auto">
      <path d="M0 5 L7 0 L14 5 L7 10 z" fill="#333"/>
    </marker>
    <style>
      .title { font-size: 22px; font-weight: 700; fill: #1a1a1a; }
      .subtitle { font-size: 13px; fill: #555; }
      .stereo { font-size: 11px; font-style: italic; fill: #555; }
      .cls-name { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .field { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; fill: #111; }
      .field-key { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; fill: #b30000; font-weight: 700; }
      .sect { font-size: 11px; font-weight: 700; fill: #2c3e50; text-transform: uppercase; letter-spacing: 0.08em; }
      .mult { font-size: 12px; font-weight: 700; fill: #333; }
      .rel-label { font-size: 12px; font-style: italic; fill: #333; }
      .note { font-size: 11px; fill: #444; }
      .enum-val { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; fill: #1a1a1a; font-weight: 700; }
      .enum-desc { font-size: 11px; fill: #555; }
      .ent { stroke: #2c3e50; stroke-width: 1.4; fill: #ffffff; }
      .ent-source { stroke: #c79100; stroke-width: 1.4; fill: #fffdf3; }
      .ent-vocab  { stroke: #0969da; stroke-width: 1.4; fill: #f4faff; }
      .ent-marker { stroke: #1f883d; stroke-width: 1.4; fill: #f3fbf5; }
      .ent-enum   { stroke: #8250df; stroke-width: 1.4; fill: #f7f3ff; }
      .ent-side   { stroke: #57606a; stroke-width: 1.2; fill: #f6f8fa; }
      .divider { stroke: #c79100; stroke-width: 0.8; }
      .divider-v { stroke: #0969da; stroke-width: 0.8; }
      .divider-m { stroke: #1f883d; stroke-width: 0.8; }
    </style>
  </defs>

  <text x="640" y="34" text-anchor="middle" class="title">Custom Markup v1.0 — Data Shape (ERD / Class View)</text>
  <text x="640" y="56" text-anchor="middle" class="subtitle">Every entity in the engine is a tiddler. Activation is a tag-and-name relationship, not a registration call.</text>

  <rect x="430" y="90" width="420" height="130" rx="6" class="ent-source"/>
  <text x="640" y="110" text-anchor="middle" class="stereo">«source tiddler»</text>
  <text x="640" y="130" text-anchor="middle" class="cls-name">Source Tiddler</text>
  <line x1="430" y1="140" x2="850" y2="140" class="divider"/>
  <text x="450" y="160" class="field-key">title  : string</text>
  <text x="450" y="178" class="field-key">type   : "text/vnd.tiddlywiki[;vocab=NameList]"</text>
  <text x="450" y="196" class="field">text   : may contain  \importcustom &lt;filter&gt;</text>
  <text x="450" y="212" class="field">                       \custom        &lt;kind&gt;=&lt;sym&gt; ...</text>

  <line x1="640" y1="220" x2="640" y2="265" stroke="#333" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="660" y="240" class="rel-label">activates</text>
  <text x="660" y="256" class="note">via `;vocab=` or `\importcustom`</text>
  <text x="618" y="240" text-anchor="end" class="mult">1</text>
  <text x="618" y="262" text-anchor="end" class="mult">0..*</text>

  <rect x="430" y="270" width="420" height="160" rx="6" class="ent-vocab"/>
  <text x="640" y="290" text-anchor="middle" class="stereo">«meta tiddler»</text>
  <text x="640" y="310" text-anchor="middle" class="cls-name">Vocabulary</text>
  <line x1="430" y1="320" x2="850" y2="320" class="divider-v"/>
  <text x="450" y="340" class="field-key">title = "vocab/&lt;lowercase-caption&gt;"   « PK »</text>
  <text x="450" y="358" class="field">tags  ∈  $:/tags/CustomMarkup/Vocabulary</text>
  <text x="450" y="376" class="field">caption        : string</text>
  <text x="450" y="394" class="field">description    : string</text>
  <text x="450" y="412" class="field">disable-core-rules? : whitespace list  (TW core rule names)</text>
  <text x="450" y="426" class="field">front-matter?       : yes | no</text>

  <line x1="640" y1="430" x2="640" y2="478" stroke="#333" stroke-width="1.6" marker-end="url(#diamond-filled)"/>
  <text x="660" y="448" class="rel-label">groups</text>
  <text x="660" y="464" class="note">marker.tags ∈ vocabulary.title</text>
  <text x="618" y="448" text-anchor="end" class="mult">1</text>
  <text x="618" y="472" text-anchor="end" class="mult">1..*</text>

  <rect x="160" y="480" width="720" height="500" rx="8" class="ent-marker"/>
  <text x="520" y="500" text-anchor="middle" class="stereo">«marker tiddler»</text>
  <text x="520" y="520" text-anchor="middle" class="cls-name">Marker</text>
  <line x1="160" y1="530" x2="880" y2="530" class="divider-m"/>

  <text x="180" y="550" class="sect">identity</text>
  <text x="180" y="568" class="field-key">title    = "vocab/&lt;v&gt;/&lt;NAME&gt;"   (convention)</text>
  <text x="180" y="584" class="field">tags     ∈ { $:/tags/CustomMarkup/Marker , vocab/&lt;v&gt; }</text>
  <text x="180" y="600" class="field">caption  : string                  description : string</text>
  <line x1="180" y1="612" x2="860" y2="612" stroke="#1f883d" stroke-width="0.4" stroke-dasharray="2,3"/>

  <text x="180" y="630" class="sect">matching</text>
  <text x="180" y="648" class="field-key">kind          : MarkerKind         « enum »</text>
  <text x="180" y="664" class="field-key">open          : string             « identity in active set »</text>
  <text x="180" y="680" class="field">close?        : string             (required for inline-pair)</text>
  <text x="180" y="696" class="field">open-pattern? : regex source       (list-item; overrides `open`)</text>
  <text x="180" y="712" class="field">max-level?    : int                (glyph-level, default 4)</text>
  <text x="180" y="728" class="field">allow-symbol? : yes | no           (glyph, inline-pair)</text>
  <line x1="180" y1="740" x2="860" y2="740" stroke="#1f883d" stroke-width="0.4" stroke-dasharray="2,3"/>

  <text x="180" y="758" class="sect">output</text>
  <text x="180" y="776" class="field">element       : html-tag | $widget         (def. div / span)</text>
  <text x="180" y="792" class="field">classes       : ".a.b.c"                   (chained CSS classes)</text>
  <text x="180" y="808" class="field">attributes?   : JSON object</text>
  <text x="180" y="824" class="field">container? / item-element? / indent-unit?  (list-item)</text>
  <line x1="180" y1="836" x2="860" y2="836" stroke="#1f883d" stroke-width="0.4" stroke-dasharray="2,3"/>

  <text x="180" y="854" class="sect">body parsing</text>
  <text x="180" y="872" class="field">mode? : block | inline   paragraph-marker?   end-string?</text>
  <text x="180" y="888" class="field">emit-open?               body-raw?           src-name?</text>
  <line x1="180" y1="900" x2="860" y2="900" stroke="#1f883d" stroke-width="0.4" stroke-dasharray="2,3"/>

  <text x="180" y="918" class="sect">editor &amp; back-compat &amp; security</text>
  <text x="180" y="936" class="field">marker-icon?   order?   legacy-kind?   allow-classes?</text>
  <text x="180" y="952" class="field">debug? : pragma|pragmaOnly|text|textOnly|both|no    debug-string?</text>
  <text x="180" y="970" class="field-key">allow-unsafe? : yes | no            (default no — sandboxed)</text>

  <line x1="880" y1="640" x2="945" y2="640" stroke="#333" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="893" y="632" class="rel-label">has</text>
  <text x="888" y="654" class="mult">1</text>

  <rect x="945" y="480" width="305" height="320" rx="6" class="ent-enum"/>
  <text x="1097" y="500" text-anchor="middle" class="stereo">«enumeration»</text>
  <text x="1097" y="520" text-anchor="middle" class="cls-name">MarkerKind</text>
  <line x1="945" y1="530" x2="1250" y2="530" stroke="#8250df" stroke-width="0.8"/>

  <text x="965" y="552" class="enum-val">glyph</text>
  <text x="965" y="568" class="enum-desc">single-fire block; line-start `open`</text>
  <text x="965" y="582" class="enum-desc">+ whitespace</text>

  <text x="965" y="606" class="enum-val">glyph-level</text>
  <text x="965" y="622" class="enum-desc">N repeats → emits `wltc-lN` class</text>
  <text x="965" y="636" class="enum-desc">(default max-level: 4)</text>

  <text x="965" y="660" class="enum-val">word</text>
  <text x="965" y="676" class="enum-desc">keyword block; single line (inline)</text>
  <text x="965" y="690" class="enum-desc">or multi-block</text>

  <text x="965" y="714" class="enum-val">inline-pair</text>
  <text x="965" y="730" class="enum-desc">`open` … `close` anywhere in a line</text>
  <text x="965" y="744" class="enum-desc">requires `close`</text>

  <text x="965" y="768" class="enum-val">list-item</text>
  <text x="965" y="784" class="enum-desc">consecutive items → one container</text>
  <text x="965" y="798" class="enum-desc">(ul/ol/dl/blockquote)</text>

  <rect x="40" y="270" width="370" height="160" rx="6" class="ent-side"/>
  <text x="225" y="290" text-anchor="middle" class="stereo">«bridged tiddler»</text>
  <text x="225" y="310" text-anchor="middle" class="cls-name">Global Pragma</text>
  <line x1="40" y1="320" x2="410" y2="320" stroke="#57606a" stroke-width="0.8"/>
  <text x="60" y="340" class="field">tags ∈ $:/tags/Pragma</text>
  <text x="60" y="358" class="field">text : \custom &lt;kind&gt;=&lt;sym&gt; ...</text>
  <text x="60" y="382" class="note">$:/config/custom-markup/pragma/PageTemplate runs</text>
  <text x="60" y="398" class="note">  \importcustom [tag[$:/tags/Pragma]]</text>
  <text x="60" y="414" class="note">→ symbols attach to every parser's cmRegistry</text>
  <text x="60" y="428" class="note">  (parsed pragmas cached per wiki, ~3× speedup)</text>

  <line x1="410" y1="350" x2="428" y2="350" stroke="#57606a" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="412" y="342" class="note">inject into every parser</text>

  <rect x="945" y="820" width="305" height="160" rx="6" class="ent-side"/>
  <text x="1097" y="840" text-anchor="middle" class="stereo">«rendered»</text>
  <text x="1097" y="860" text-anchor="middle" class="cls-name">HTML Output</text>
  <line x1="945" y1="870" x2="1250" y2="870" stroke="#57606a" stroke-width="0.8"/>
  <text x="965" y="890" class="field">element     ← marker.element</text>
  <text x="965" y="906" class="field">classes     ← "wltc"</text>
  <text x="965" y="920" class="field">              + "wltc-l&lt;N&gt;"  (glyph-level)</text>
  <text x="965" y="934" class="field">              + marker.classes</text>
  <text x="965" y="950" class="field">attributes  ← scrubbed JSON</text>
  <text x="965" y="966" class="note">(sandbox iframe; deny object/embed/frame;</text>
  <text x="965" y="978" class="note">  strip javascript: URLs)</text>

  <line x1="880" y1="860" x2="945" y2="900" stroke="#333" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="892" y="894" class="rel-label">renders</text>

  <rect x="40" y="480" width="110" height="500" rx="6" fill="#fff8e1" stroke="#c79100" stroke-width="1.2"/>
  <text x="95" y="505" text-anchor="middle" class="sect" fill="#7a5a00">example</text>
  <text x="95" y="525" text-anchor="middle" class="field" font-weight="700">vocab/</text>
  <text x="95" y="540" text-anchor="middle" class="field" font-weight="700">fountain</text>

  <text x="50" y="580" class="field" font-size="10">title:</text>
  <text x="50" y="594" class="field" font-size="10">  vocab/</text>
  <text x="50" y="608" class="field" font-size="10">  fountain/</text>
  <text x="50" y="622" class="field" font-size="10">  INT</text>
  <text x="50" y="646" class="field" font-size="10">tags:</text>
  <text x="50" y="660" class="field" font-size="10">  Marker</text>
  <text x="50" y="674" class="field" font-size="10">  vocab/</text>
  <text x="50" y="688" class="field" font-size="10">  fountain</text>
  <text x="50" y="712" class="field" font-size="10">kind:</text>
  <text x="50" y="726" class="field" font-size="10">  word</text>
  <text x="50" y="746" class="field" font-size="10">open:</text>
  <text x="50" y="760" class="field" font-size="10">  INT.</text>
  <text x="50" y="780" class="field" font-size="10">element:</text>
  <text x="50" y="794" class="field" font-size="10">  p</text>
  <text x="50" y="814" class="field" font-size="10">classes:</text>
  <text x="50" y="828" class="field" font-size="10">  .wltc-</text>
  <text x="50" y="842" class="field" font-size="10">  fountain-</text>
  <text x="50" y="856" class="field" font-size="10">  scene-</text>
  <text x="50" y="870" class="field" font-size="10">  heading</text>
  <text x="50" y="890" class="field" font-size="10">mode:</text>
  <text x="50" y="904" class="field" font-size="10">  inline</text>
  <text x="50" y="924" class="field" font-size="10">emit-</text>
  <text x="50" y="938" class="field" font-size="10">  open: yes</text>
  <text x="50" y="958" class="field" font-size="10">paragraph-</text>
  <text x="50" y="972" class="field" font-size="10">  marker: yes</text>

  <rect x="40" y="90" width="370" height="160" rx="6" fill="#ffffff" stroke="#999"/>
  <text x="60" y="112" class="sect">legend</text>
  <text x="60" y="134" class="note"><tspan class="mult">1 ── 0..*</tspan>   simple cardinality</text>
  <line x1="60" y1="148" x2="120" y2="148" stroke="#333" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="130" y="152" class="note">association (arrow points to target)</text>
  <line x1="60" y1="170" x2="120" y2="170" stroke="#333" stroke-width="1.6" marker-end="url(#diamond-filled)"/>
  <text x="130" y="174" class="note">composition (filled diamond at owner)</text>
  <line x1="60" y1="192" x2="120" y2="192" stroke="#333" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="130" y="196" class="note">dependency / dataflow</text>
  <text x="60" y="220" class="note"><tspan class="field-key">red text</tspan> = primary key or required identity field</text>
  <text x="60" y="236" class="note">`?` suffix = optional field</text>

  <text x="640" y="1010" text-anchor="middle" class="note">Convention: title = "vocab/&lt;lowercase-caption&gt;" lets <tspan class="field">registry.activate(name)</tspan> do a direct <tspan class="field">getTiddler</tspan> instead of a filter walk (~33× faster than pre-beta-29).</text>
</svg>