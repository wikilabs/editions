<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#555"/>
    </marker>
    <style>
      .title { font-size: 22px; font-weight: 700; fill: #1a1a1a; }
      .subtitle { font-size: 13px; fill: #555; }
      .layer { stroke: #2c3e50; stroke-width: 1.4; }
      .repo-label { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .repo-sub { font-size: 11px; fill: #555; font-style: italic; }
      .group-label { font-size: 13px; font-weight: 700; fill: #2c3e50; }
      .item { font-size: 11.5px; fill: #222; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; fill: #1a1a1a; }
      .badge { font-size: 11px; font-weight: 700; }
      .arrowLabel { font-size: 11.5px; fill: #555; font-style: italic; }
    </style>
  </defs>

  <text x="600" y="34" text-anchor="middle" class="title">Custom Markup v1.0 — Three Repositories</text>
  <text x="600" y="56" text-anchor="middle" class="subtitle">plugins/wikilabs/custom-markup  +  editions/custom-markup  +  editions/custom-markup-server</text>

  <rect x="60" y="90" width="1080" height="110" rx="8" fill="#fff4d6" class="layer"/>
  <rect x="60" y="90" width="220" height="110" rx="8" fill="#f7c948" class="layer"/>
  <text x="170" y="130" text-anchor="middle" class="repo-label">custom-markup-server</text>
  <text x="170" y="150" text-anchor="middle" class="repo-sub">editions/ — Node.js</text>
  <text x="170" y="172" text-anchor="middle" class="badge" fill="#5a3e00">EDITION (server)</text>

  <text x="300" y="120" class="group-label">Server config (tiddlywiki.info)</text>
  <text x="300" y="142" class="mono">plugins: tiddlywiki/tiddlyweb · filesystem · internals</text>
  <text x="300" y="160" class="mono">         wikilabs/advanced-search-plus · link-to-tabs · tw-mcp</text>
  <text x="300" y="180" class="mono">includeWikis: ../custom-markup</text>

  <line x1="600" y1="200" x2="600" y2="232" stroke="#555" stroke-width="2" marker-end="url(#arr)"/>
  <text x="612" y="222" class="arrowLabel">includes</text>

  <rect x="60" y="240" width="1080" height="200" rx="8" fill="#e6f4ff" class="layer"/>
  <rect x="60" y="240" width="220" height="200" rx="8" fill="#6cb6ff" class="layer"/>
  <text x="170" y="280" text-anchor="middle" class="repo-label">custom-markup</text>
  <text x="170" y="300" text-anchor="middle" class="repo-sub">editions/ — browser/Node</text>
  <text x="170" y="322" text-anchor="middle" class="badge" fill="#0a3d6e">EDITION (docs + extras)</text>
  <text x="170" y="390" text-anchor="middle" class="mono">themes: vanilla · snowwhite</text>
  <text x="170" y="408" text-anchor="middle" class="mono">build: index · github · static</text>

  <text x="300" y="270" class="group-label">Extra vocabularies (shadow tiddlers)</text>
  <text x="300" y="290" class="mono">vocab/fountain     (screenplay DSL — disables `heading list`)</text>
  <text x="300" y="307" class="mono">vocab/markdown     (#..######, *em*, **bold**, `code`, |table|, lists)</text>
  <text x="300" y="324" class="mono">vocab/presentation (Reveal.js wrapper: PRESENTATION, CUT TO:, FADE OUT.)</text>
  <text x="300" y="341" class="mono">vocab/color-boxes · vocab/html-elements · vocab/lists · vocab/table · vocab/demo</text>

  <text x="300" y="370" class="group-label">Documentation tiddlers</text>
  <text x="300" y="388" class="mono">Vocabulary Engine · Marker Kinds · Marker Fields · Activating a Vocabulary</text>
  <text x="300" y="405" class="mono">Combining vocabularies · Shipped Vocabularies · Debugging markers · Custom Markup Security</text>
  <text x="300" y="422" class="mono">Example - * (Fountain, Markdown, Reveal.js, color boxes, word markers, ...)</text>

  <line x1="600" y1="440" x2="600" y2="472" stroke="#555" stroke-width="2" marker-end="url(#arr)"/>
  <text x="612" y="462" class="arrowLabel">depends on plugin</text>

  <rect x="60" y="480" width="1080" height="310" rx="8" fill="#e8f7e8" class="layer"/>
  <rect x="60" y="480" width="220" height="310" rx="8" fill="#7ec97e" class="layer"/>
  <text x="170" y="520" text-anchor="middle" class="repo-label">custom-markup</text>
  <text x="170" y="540" text-anchor="middle" class="repo-sub">plugins/wikilabs/ — engine</text>
  <text x="170" y="562" text-anchor="middle" class="badge" fill="#1f5a1f">PLUGIN</text>
  <text x="170" y="600" text-anchor="middle" class="mono">$:/plugins/wikilabs/</text>
  <text x="170" y="616" text-anchor="middle" class="mono">custom-markup</text>
  <text x="170" y="640" text-anchor="middle" class="mono" font-weight="700">v1.0.0-beta-35</text>
  <text x="170" y="670" text-anchor="middle" class="repo-sub">stability:</text>
  <text x="170" y="686" text-anchor="middle" class="repo-sub">EXPERIMENTAL</text>

  <text x="300" y="510" class="group-label">wikirules/  (TW parse rules)</text>
  <text x="300" y="528" class="mono">registry.js          marker registry, active set, regex builder</text>
  <text x="300" y="544" class="mono">marker-block.js      `cmblock`  — glyph · glyph-level · word · list-item</text>
  <text x="300" y="560" class="mono">marker-inline.js     `cminline` — inline-pair</text>
  <text x="300" y="576" class="mono">yaml.js              vendored YAML for front-matter</text>
  <text x="300" y="592" class="mono">pragmas/             \custom · \importcustom · \debugcustom · \debugmarker</text>
  <text x="300" y="608" class="mono">markdown-flavour/    front-matter · markdown-newline · markdown-table</text>

  <text x="300" y="638" class="group-label">vocabularies/  (shadow markers)</text>
  <text x="300" y="656" class="mono">default/       ° · . · » · ›  (block)   /° °/, ❮ ❯, ⠒ ⠶  (inline-pair)</text>
  <text x="300" y="672" class="mono">legacy-glyphs/ ´ · ≈ · ¶  (opt-in, restores v0.x removed glyphs)</text>

  <text x="780" y="638" class="group-label">UI / integration</text>
  <text x="780" y="656" class="mono">EditorToolbar/   vocab-filtered dropdowns</text>
  <text x="780" y="672" class="mono">ControlPanel/    Custom Markup dashboard</text>
  <text x="780" y="688" class="mono">ViewTemplate/    vocab + marker summaries</text>
  <text x="780" y="704" class="mono">widgets/         wl-keyboard · wl-radio</text>
  <text x="780" y="720" class="mono">filteroperators/ [cm-active-markers[]]</text>
  <text x="780" y="736" class="mono">startup/         fix-vocab-type.js (node)</text>

  <text x="300" y="702" class="group-label">configuration</text>
  <text x="300" y="720" class="mono">$:/config/custom-markup/pragma/PageTemplate</text>
  <text x="300" y="736" class="mono">  → \importcustom [tag[$:/tags/Pragma]]  (global pragma bridge)</text>

  <text x="300" y="772" class="repo-sub">Marker tag: $:/tags/CustomMarkup/Marker     Vocabulary tag: $:/tags/CustomMarkup/Vocabulary     Convention: vocab title = "vocab/&lt;lowercase-caption&gt;"</text>
</svg>