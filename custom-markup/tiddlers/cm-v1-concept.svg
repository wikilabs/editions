<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 600" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .title    { font-size: 22px; font-weight: 700; fill: #1a1a1a; }
      .subtitle { font-size: 13px; fill: #555; }
      .card-num   { font-size: 30px; font-weight: 700; }
      .card-h     { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .card-sub   { font-size: 11.5px; fill: #555; font-style: italic; }
      .code       { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; fill: #111; }
      .code-key   { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; fill: #b30000; font-weight: 700; }
      .hint       { font-size: 11px; fill: #444; font-style: italic; }
      .pill-text  { font-size: 13px; font-weight: 700; fill: #ffffff; }
      .pill-sub   { font-size: 11px; fill: #ffffff; opacity: 0.95; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .gallery-h  { font-size: 13px; font-weight: 700; fill: #1a1a1a; }
      .card-m     { stroke: #1f883d; stroke-width: 1.6; fill: #f3fbf5; }
      .card-v     { stroke: #0969da; stroke-width: 1.6; fill: #f4faff; }
      .card-a     { stroke: #c79100; stroke-width: 1.6; fill: #fffdf3; }
      .code-bg    { fill: #ffffff; stroke: #d0d7de; stroke-width: 0.8; }
    </style>
  </defs>

  <text x="570" y="36" text-anchor="middle" class="title">Custom Markup v1.0 — How it composes</text>
  <text x="570" y="58" text-anchor="middle" class="subtitle">A marker is a tiddler. A vocabulary is a tag set. Two ways to opt in.</text>

  <rect x="40" y="90" width="340" height="240" rx="10" class="card-m"/>
  <text x="62" y="124" class="card-num" fill="#1f883d">①</text>
  <text x="108" y="118" class="card-h">A marker is a tiddler</text>
  <text x="108" y="138" class="card-sub">tagged with $:/tags/CustomMarkup/Marker</text>
  <text x="108" y="152" class="card-sub">+ the vocabulary's title</text>

  <rect x="60" y="170" width="300" height="120" rx="6" class="code-bg"/>
  <text x="74" y="192" class="code-key">title:</text>
  <text x="120" y="192" class="code">vocab/fountain/INT</text>
  <text x="74" y="208" class="code-key">tags:</text>
  <text x="120" y="208" class="code">$:/tags/CustomMarkup/Marker</text>
  <text x="120" y="224" class="code">[[vocab/fountain]]</text>
  <text x="74" y="244" class="code-key">kind:</text>
  <text x="120" y="244" class="code">word</text>
  <text x="74" y="260" class="code-key">open:</text>
  <text x="120" y="260" class="code">INT.</text>
  <text x="74" y="278" class="code">element: p   classes: .wltc-...</text>

  <text x="60" y="312" class="hint">→ field reference: [[Overview - Data Shape (v1.0)]]</text>

  <rect x="400" y="90" width="340" height="240" rx="10" class="card-v"/>
  <text x="422" y="124" class="card-num" fill="#0969da">②</text>
  <text x="468" y="118" class="card-h">Vocabularies group markers</text>
  <text x="468" y="138" class="card-sub">one meta tiddler per vocab,</text>
  <text x="468" y="152" class="card-sub">titled `vocab/&lt;lowercase-caption&gt;`</text>

  <rect x="420" y="170" width="300" height="120" rx="6" class="code-bg"/>
  <text x="434" y="192" class="code-key">title:</text>
  <text x="480" y="192" class="code">vocab/fountain</text>
  <text x="434" y="208" class="code-key">tags:</text>
  <text x="480" y="208" class="code">$:/tags/CustomMarkup/Vocabulary</text>
  <text x="434" y="228" class="code">caption: Fountain</text>
  <text x="434" y="246" class="code">description: Screenplay markers</text>
  <text x="434" y="266" class="code">disable-core-rules: heading list</text>
  <text x="434" y="282" class="code">front-matter: yes</text>

  <text x="420" y="312" class="hint">grouping is implicit: marker.tags ∈ vocab.title</text>

  <rect x="760" y="90" width="340" height="240" rx="10" class="card-a"/>
  <text x="782" y="124" class="card-num" fill="#c79100">③</text>
  <text x="828" y="118" class="card-h">Two activation paths</text>
  <text x="828" y="138" class="card-sub">in the tiddler that wants the markers</text>
  <text x="828" y="152" class="card-sub">to fire</text>

  <text x="780" y="180" class="card-sub" font-weight="700" fill="#1a1a1a">A. Type field (persisted)</text>
  <rect x="780" y="186" width="300" height="40" rx="5" class="code-bg"/>
  <text x="794" y="208" class="code-key">type:</text>
  <text x="836" y="208" class="code">text/vnd.tiddlywiki</text>
  <text x="794" y="222" class="code">      ;vocab=Default,Markdown</text>

  <text x="780" y="252" class="card-sub" font-weight="700" fill="#1a1a1a">B. Pragma (per-tiddler)</text>
  <rect x="780" y="258" width="300" height="40" rx="5" class="code-bg"/>
  <text x="794" y="280" class="code">\importcustom [tag[vocab/fountain]]</text>
  <text x="794" y="294" class="code">\custom &lt;kind&gt;=&lt;sym&gt; ...</text>

  <text x="760" y="318" class="hint">no `;vocab=` → vocab/default is implicit</text>

  <text x="40" y="368" class="gallery-h">The five marker kinds</text>
  <text x="220" y="368" class="card-sub">— what `kind` can be on a marker tiddler</text>

  <g>
    <rect x="40"  y="384" width="208" height="96" rx="8" fill="#1f6feb"/>
    <text x="144" y="412" text-anchor="middle" class="pill-text">glyph</text>
    <text x="144" y="436" text-anchor="middle" class="pill-sub">.   ›   °</text>
    <text x="144" y="460" text-anchor="middle" class="pill-sub" font-style="italic" font-family="-apple-system">single-fire block</text>
  </g>
  <g>
    <rect x="258" y="384" width="208" height="96" rx="8" fill="#2da44e"/>
    <text x="362" y="412" text-anchor="middle" class="pill-text">glyph-level</text>
    <text x="362" y="436" text-anchor="middle" class="pill-sub">»  »»  »»»</text>
    <text x="362" y="460" text-anchor="middle" class="pill-sub" font-style="italic" font-family="-apple-system">N reps → wltc-lN</text>
  </g>
  <g>
    <rect x="476" y="384" width="208" height="96" rx="8" fill="#8250df"/>
    <text x="580" y="412" text-anchor="middle" class="pill-text">word</text>
    <text x="580" y="436" text-anchor="middle" class="pill-sub">INT.   ##   CUT TO:</text>
    <text x="580" y="460" text-anchor="middle" class="pill-sub" font-style="italic" font-family="-apple-system">keyword block</text>
  </g>
  <g>
    <rect x="694" y="384" width="208" height="96" rx="8" fill="#cf222e"/>
    <text x="798" y="412" text-anchor="middle" class="pill-text">inline-pair</text>
    <text x="798" y="436" text-anchor="middle" class="pill-sub">/° °/   ❮ ❯</text>
    <text x="798" y="460" text-anchor="middle" class="pill-sub" font-style="italic" font-family="-apple-system">open … close inline</text>
  </g>
  <g>
    <rect x="912" y="384" width="188" height="96" rx="8" fill="#bf8700"/>
    <text x="1006" y="412" text-anchor="middle" class="pill-text">list-item</text>
    <text x="1006" y="436" text-anchor="middle" class="pill-sub">-   *   1.</text>
    <text x="1006" y="460" text-anchor="middle" class="pill-sub" font-style="italic" font-family="-apple-system">ul / ol / dl / blockquote</text>
  </g>

  <text x="570" y="540" text-anchor="middle" class="subtitle">Collision rule: when two activated vocabs share an `open`, the <tspan font-weight="700" fill="#1a1a1a">last listed</tspan> wins. See [[Overview - Vocabularies &amp; Markers (v1.0)]] for the narrative.</text>
</svg>